name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (must match package.json and __version__)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install -y zip rsync

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate requested version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["VERSION"]
          package_version = json.loads(Path("package.json").read_text())["version"]
          init_text = Path("py_modules/reshade_shader_manager/__init__.py").read_text()
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if not match:
              raise SystemExit("Could not read __version__ from py_modules/reshade_shader_manager/__init__.py")
          python_version = match.group(1)

          if expected != package_version:
              raise SystemExit(
                  f"workflow input version {expected!r} does not match package.json version {package_version!r}"
              )
          if expected != python_version:
              raise SystemExit(
                  f"workflow input version {expected!r} does not match Python package version {python_version!r}"
              )
          PY

      - name: Ensure release tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Build release zip
        run: ./scripts/build-release.sh

      - name: Validate release artifact
        run: test -f "release/RSM-Decky-v${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/RSM-Decky-v${{ env.VERSION }}.zip
